<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kitaplığım</title>
<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#16212b;--mute:#667483;--line:#dde3e8;--acc:#1f5f8b;--acc-ink:#fff;--ok:#2c7a4b;--ok-bg:#e3f2e9;--loan:#a9650f;--loan-bg:#fbeedb;--danger:#b3322b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mute:#93a1ae;--line:#2a3743;--acc:#5aa6d6;--acc-ink:#0b1217;--ok:#6cc58d;--ok-bg:#1b3326;--loan:#e3a550;--loan-bg:#3a2a12;--danger:#ef7b73}}
:root[data-theme="dark"]{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mute:#93a1ae;--line:#2a3743;--acc:#5aa6d6;--acc-ink:#0b1217;--ok:#6cc58d;--ok-bg:#1b3326;--loan:#e3a550;--loan-bg:#3a2a12;--danger:#ef7b73}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 0 10px;z-index:5;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{margin:0;font:700 26px/1.1 "Iowan Old Style",Georgia,"Times New Roman",serif}
.sub{color:var(--mute);font-size:13px}
.search{margin-top:10px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.search:focus,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.bar{display:flex;gap:8px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.del{color:var(--danger)}
.banner{background:var(--loan-bg);color:var(--loan);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px}
.seed{background:var(--card);border:1px dashed var(--acc);border-radius:12px;padding:18px;margin:16px 0;text-align:center}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;display:grid;gap:8px}
.t{font:600 17px/1.25 "Iowan Old Style",Georgia,serif}
.a{color:var(--mute);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--bg);color:var(--mute)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.loan{background:var(--loan-bg);color:var(--loan)}
.sp{flex:1}
.note{font-size:14px;white-space:pre-wrap;border-left:3px solid var(--acc);padding:2px 0 2px 10px;color:var(--ink)}
textarea{width:100%;min-height:130px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
dialog input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.dact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
h2{margin:0 0 4px;font:700 19px/1.2 "Iowan Old Style",Georgia,serif}
</style>
</head>
<body>
<div class="wrap" id="login" hidden>
 <div style="padding-top:60px"><h1>Kitaplığım</h1><p class="a">Devam etmek için giriş yap.</p>
 <label for="lgE">E-posta</label><input class="search" style="margin-top:0" id="lgE" type="email" autocomplete="username">
 <label for="lgP">Parola</label><input class="search" style="margin-top:0" id="lgP" type="password" autocomplete="current-password">
 <div id="lgErr" class="banner" hidden></div>
 <div class="dact" style="justify-content:flex-start"><button class="btn pri" id="lgGo">Giriş yap</button></div></div>
</div>
<div class="wrap" id="app" hidden>
<header>
 <div class="top"><h1>Kitaplığım</h1><span class="sub" id="count"></span></div>
 <input class="search" id="q" type="search" placeholder="Kitap veya yazar ara" autocomplete="off" aria-label="Kitap veya yazar ara">
 <div class="tabs" id="tabs"></div>
</header>
<div class="bar">
 <button class="btn pri" id="add">Kitap ekle</button>
 <span style="flex:1"></span>
 <button class="btn" id="restore">Yedekten yükle</button>
 <button class="btn" id="backup">Yedekle</button>
 <button class="btn" id="out">Çıkış</button>
 <input type="file" id="file" accept=".json,application/json" hidden>
</div>
<div id="banner"></div>
<div id="list"></div>
</div>

<dialog id="dAdd"><h2>Yeni kitap</h2>
 <label for="addT">Kitap adı</label><input id="addT" autocomplete="off">
 <label for="addA">Yazar</label><input id="addA" autocomplete="off">
 <div class="dact"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="addOk">Ekle</button></div>
</dialog>
<dialog id="dLoan"><h2>Ödünç ver</h2><div class="a" id="loanBook"></div>
 <label for="loanTo">Kime verdin?</label><input id="loanTo" autocomplete="off">
 <label for="loanD">Hangi tarihte?</label><input id="loanD" type="date">
 <div class="dact"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="loanOk">Kaydet</button></div>
</dialog>
<dialog id="dEdit"><h2>Kitabı düzenle</h2>
 <label for="edT">Kitap adı</label><input id="edT" autocomplete="off">
 <label for="edA">Yazar</label><input id="edA" autocomplete="off">
 <label for="edN">Düşüncelerim ve notlarım</label><textarea id="edN" placeholder="Bu kitap hakkında ne düşünüyorsun?"></textarea>
 <div class="dact"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="edOk">Kaydet</button></div>
</dialog>
<dialog id="dDel"><h2>Kitabı çıkar</h2><div class="a" id="delBook"></div>
 <div class="dact"><button class="btn" data-close>Vazgeç</button><button class="btn del" id="delOk">Çıkar</button></div>
</dialog>

let books=[], loaded=false, ref=null, unsub=null;
let filter='all', query='', target=null, saving=Promise.resolve();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s||'').replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase().replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
const fmt=d=>{if(!d)return'';const [y,m,g]=d.split('-');return g+'.'+m+'.'+y};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mkSeed=()=>SEED.map((b,i)=>({id:'s'+i,t:b.t,a:b.a,n:'',r:false,l:null}));

function persist(){
  if(!ref) return;
  const snapshot=books.slice();
  saving=saving.then(()=>setDoc(ref,{books:snapshot})).catch(e=>{$('banner').innerHTML='<div class="banner">Kayıt yapılamadı. Sayfayı yenileyip tekrar dene.</div>';console.error(e)});
}
function change(fn){fn();persist();render()}

function render(){
  const nq=fold(query).trim();
  const counts={all:books.length,read:books.filter(b=>b.r).length,unread:books.filter(b=>!b.r).length,loan:books.filter(b=>b.l).length};
  const tabs=[['all','Hepsi'],['unread','Okunmadı'],['read','Okundu'],['loan','Ödünçte']];
  $('tabs').innerHTML=tabs.map(([k,n])=>`<button class="tab" data-f="${k}" aria-pressed="${filter===k}">${n} ${counts[k]}</button>`).join('');
  $('count').textContent=books.length+' kitap';
  let list=books.filter(b=>(filter==='all'||(filter==='read'&&b.r)||(filter==='unread'&&!b.r)||(filter==='loan'&&b.l))&&(!nq||fold(b.t).includes(nq)||fold(b.a).includes(nq)||fold(b.n).includes(nq)));
  list.sort((x,y)=>x.t.localeCompare(y.t,'tr'));
  if(loaded&&!books.length&&ref){
    $('list').innerHTML=`<div class="seed"><p>Kitaplık henüz boş. Excel listendeki ${SEED.length} kitabı yükleyebilirsin.</p><button class="btn pri" id="seedBtn">Listemi yükle</button></div>`;
    return;
  }
  $('list').innerHTML=list.length?list.map(b=>`<div class="row" data-id="${esc(b.id)}">
   <div><div class="t">${esc(b.t)}</div><div class="a">${esc(b.a)||'Yazar yok'}</div></div>
   ${b.n?`<div class="note">${esc(b.n)}</div>`:''}
   <div class="acts">
    ${b.r?'<span class="chip ok">Okundu</span>':'<span class="chip">Okunmadı</span>'}
    ${b.l?`<span class="chip loan">${esc(b.l.to)}'e verildi, ${fmt(b.l.d)}</span>`:''}
    <span class="sp"></span>
    <button class="btn" data-act="edit">${b.n?'Düzenle / not':'Düzenle / not ekle'}</button>
    <button class="btn" data-act="read">${b.r?'Okunmadı yap':'Okundu yap'}</button>
    <button class="btn" data-act="loan">${b.l?'Geri aldım':'Ödünç ver'}</button>
    <button class="btn del" data-act="del" aria-label="Çıkar">Çıkar</button>
   </div></div>`).join(''):'<div class="empty">Sonuç bulunamadı.</div>';
}

$('q').addEventListener('input',e=>{query=e.target.value;render()});
$('tabs').addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;render()}});
$('list').addEventListener('click',e=>{
  if(e.target.id==='seedBtn'){change(()=>{books=mkSeed()});return}
  const btn=e.target.closest('[data-act]');if(!btn)return;
  const b=books.find(x=>x.id===btn.closest('.row').dataset.id);if(!b)return;target=b;
  if(btn.dataset.act==='edit'){$('edT').value=b.t;$('edA').value=b.a||'';$('edN').value=b.n||'';$('dEdit').showModal()}
  else if(btn.dataset.act==='read')change(()=>{b.r=!b.r});
  else if(btn.dataset.act==='loan'){
    if(b.l)change(()=>{b.l=null});
    else{$('loanBook').textContent=b.t;$('loanTo').value='';$('loanD').value=today();$('dLoan').showModal()}
  }else{$('delBook').textContent=b.t+(b.a?' - '+b.a:'');$('dDel').showModal()}
});
document.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',e=>e.target.closest('dialog').close()));
$('add').onclick=()=>{$('addT').value='';$('addA').value='';$('dAdd').showModal();$('addT').focus()};
$('addOk').onclick=()=>{
  const t=$('addT').value.trim();if(!t){$('addT').focus();return}
  change(()=>{books.push({id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t,a:$('addA').value.trim(),n:'',r:false,l:null})});
  $('dAdd').close();
};
$('loanOk').onclick=()=>{
  const to=$('loanTo').value.trim();if(!to){$('loanTo').focus();return}
  change(()=>{target.l={to,d:$('loanD').value||today()}});$('dLoan').close();
};
$('edOk').onclick=()=>{
  const t=$('edT').value.trim();if(!t){$('edT').focus();return}
  change(()=>{target.t=t;target.a=$('edA').value.trim();target.n=$('edN').value.trim()});$('dEdit').close();
};
$('delOk').onclick=()=>{change(()=>{books=books.filter(x=>x!==target)});$('dDel').close()};
$('backup').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(books,null,1)],{type:'application/json'}));
  a.download='kitaplik-yedek.json';document.body.appendChild(a);a.click();a.remove();
};
$('restore').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const arr=JSON.parse(await f.text());
    if(!Array.isArray(arr)||!arr.every(b=>b&&typeof b.t==='string'))throw 0;
    if(confirm('Kitaplığındaki '+books.length+' kitabın yerine yedekteki '+arr.length+' kitap yüklensin mi?'))change(()=>{books=arr});
  }catch(err){alert('Bu dosya bir kitaplık yedeği gibi görünmüyor.')}
};
$('out').onclick=()=>signOut(auth);

const errTxt={'auth/invalid-credential':'E-posta veya parola hatalı.','auth/invalid-email':'E-posta adresi geçersiz.','auth/too-many-requests':'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.','auth/network-request-failed':'İnternet bağlantısı yok.'};
async function login(){
  $('lgErr').hidden=true;
  try{await signInWithEmailAndPassword(auth,$('lgE').value.trim(),$('lgP').value)}
  catch(e){$('lgErr').textContent=errTxt[e.code]||'Giriş yapılamadı ('+(e.code||'bilinmeyen hata')+').';$('lgErr').hidden=false}
}
$('lgGo').onclick=login;
$('lgP').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

onAuthStateChanged(auth,user=>{
  if(unsub){unsub();unsub=null}
  if(!user){ref=null;books=[];loaded=false;$('app').hidden=true;$('login').hidden=false;return}
  $('login').hidden=true;$('app').hidden=false;$('lgP').value='';
  ref=doc(fdb,'library','main');
  unsub=onSnapshot(ref,snap=>{
    const d=snap.exists()?snap.data():null;
    books=d&&Array.isArray(d.books)?d.books:[];
    loaded=true;$('banner').innerHTML='';render();
  },()=>{$('banner').innerHTML='<div class="banner">Kitaplığa erişilemedi. İnternetini ve güvenlik kuralını kontrol et.</div>'});
});
render();
</script>
</body>
</html>
