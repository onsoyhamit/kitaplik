<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kitaplığım</title>
<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#16212b;--mute:#667483;--line:#dde3e8;--acc:#1f5f8b;--acc-ink:#fff;--ok:#2c7a4b;--ok-bg:#e3f2e9;--loan:#a9650f;--loan-bg:#fbeedb;--danger:#b3322b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mute:#93a1ae;--line:#2a3743;--ok:#6cc58d;--ok-bg:#1b3326;--loan:#e3a550;--loan-bg:#3a2a12;--danger:#ef7b73}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1,h2,h3{margin:0;font-family:"Iowan Old Style",Georgia,serif}h1{font-size:1.4rem}h2{font-size:1.25rem}h3{font-size:1rem;margin:18px 0 8px}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:0 0 10px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:10px 13px;font:inherit;font-size:.9rem;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.del{color:var(--danger)}.wide{width:100%;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}@media(max-width:360px){.grid{grid-template-columns:1fr 1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;border-left:3px solid var(--acc)}
.tile b{display:block;font:700 1.25rem/1.1 "Iowan Old Style",Georgia,serif}.tile span{color:var(--mute);font-size:.75rem}
.sm{padding:6px 10px;font-size:.8rem}.srow{display:flex;gap:8px;align-items:flex-start}.srow .inp{flex:1;margin:0 0 10px}
.thb{padding:7px 11px;font-size:.8rem}.thb[aria-pressed=true]{outline:2px solid var(--acc);outline-offset:1px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:12px;cursor:pointer}
.main{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}.grow{flex:1;min-width:0}
.cov{width:48px;height:72px;object-fit:cover;border-radius:4px;background:var(--bg);flex:0 0 auto}.cov.lg{width:110px;height:165px}.ph{border:1px dashed var(--line)}
.t{font:600 1.05rem/1.25 "Iowan Old Style",Georgia,serif}.t.big{font-size:1.35rem}.a{color:var(--mute);font-size:.9rem}
.acts,.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.btns{margin:12px 0}
.chip{font-size:.75rem;border-radius:999px;padding:3px 9px;background:var(--bg);color:var(--mute)}.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.loan{background:var(--loan-bg);color:var(--loan)}
.card2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}.card2 h3{margin:0 0 6px}
.note{white-space:pre-wrap}.empty{text-align:center;color:var(--mute);padding:30px 10px}
.stars{margin-top:8px}.star{background:none;border:0;font-size:1.8rem;color:var(--line);cursor:pointer;padding:0 4px}.star.on{color:#e0a100}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
select.inp{width:auto;min-width:160px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(92vw,420px)}dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
dialog input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}textarea{min-height:130px;resize:vertical}
.dact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.banner{background:var(--loan-bg);color:var(--loan);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:.9rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:20;max-width:92vw;display:flex;gap:10px;align-items:center}#toast[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap" id="login" hidden>
 <div style="padding-top:60px"><h1>Kitaplığım</h1><p class="a">Devam etmek için giriş yap.</p>
 <label for="lgE">E-posta</label><input class="inp" id="lgE" type="email" autocomplete="username">
 <label for="lgP">Parola</label><input class="inp" id="lgP" type="password" autocomplete="current-password">
 <div id="lgErr" class="banner" hidden></div>
 <button class="btn pri" id="lgGo">Giriş yap</button></div>
</div>
<div class="wrap" id="main" hidden><div id="view"></div></div>
<div id="toast" hidden></div>
<input type="file" id="csv" accept=".csv,text/csv,text/plain" hidden>
<input type="file" id="file" accept=".json,application/json" hidden>
<dialog id="dAdd"><h2>Yeni kitap</h2>
 <label for="addT">Kitap adı</label><input id="addT" autocomplete="off">
 <label for="addA">Yazar</label><input id="addA" autocomplete="off">
 <div class="dact"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="addOk">Ekle</button></div>
</dialog>
<dialog id="dLoan"><h2>Ödünç ver</h2><div class="a" id="loanBook"></div>
 <label for="loanTo">Kime verdin?</label><input id="loanTo" autocomplete="off">
 <label for="loanD">Hangi tarihte?</label><input id="loanD" type="date">
 <div class="dact"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="loanOk">Kaydet</button></div>
</dialog>
<dialog id="dEdit"><h2>Kitabı düzenle</h2>
 <label for="edT">Kitap adı</label><input id="edT" autocomplete="off">
 <label for="edA">Yazar</label><input id="edA" autocomplete="off">
 <label for="edU">1000kitap bağlantısı (isteğe bağlı)</label><input id="edU" type="url" placeholder="https://1000kitap.com/kitap/...">
 <label for="edN">Düşüncelerim ve notlarım</label><textarea id="edN" placeholder="Bu kitap hakkında ne düşünüyorsun?"></textarea>
 <div class="dact"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="edOk">Kaydet</button></div>
</dialog>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDXUBmcjysOB9-JEXDvJGQXLKJmdK9EmP0",
  authDomain: "kitapligim55.firebaseapp.com",
  projectId: "kitapligim55",
  storageBucket: "kitapligim55.firebasestorage.app",
  messagingSenderId: "930194490379",
  appId: "1:930194490379:web:b3c6a1c8d1f755a2db730e"
};
const fapp=initializeApp(firebaseConfig);
const auth=getAuth(fapp);
let fdb;
try{fdb=initializeFirestore(fapp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fdb=getFirestore(fapp)}

let pend='',books=[],set={},ref=null,unsub=null,nav={v:'home',f:'all'},sortBy='ad',qtext='',purged=false,scanMsg='',target=null,saving=Promise.resolve();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s||'').replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase().replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
const fmt=d=>d?d.split('-').reverse().join('.'):'';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const F={all:()=>true,read:b=>b.r,unread:b=>!b.r,reading:b=>b.k&&!b.r,loan:b=>b.l,notes:b=>b.n};
const L={all:'Tüm kitaplar',read:'Okunan',unread:'Okunmayan',reading:'Şu an okuyorum',loan:'Ödünçte',notes:'Notlu kitaplar'};
const act=()=>books.filter(b=>!b.x);
const busy=new Set();
const okUrl=u=>{try{const x=new URL(u);return x.protocol==='https:'&&/(^|\.)1000kitap\.com$/.test(x.hostname)}catch(e){return false}};
const hasU=b=>!!(b.u&&okUrl(b.u));
const kLink=b=>hasU(b)?b.u:'https://1000kitap.com/ara?q='+encodeURIComponent((b.t+' '+(b.a||'')).trim())+'&bolum=kitaplar';

const GB_KEY='AIzaSyBLHvfYoMF5-2i9y5x_vRdxeO56BKZiM4c';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=x=>fold(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const tokEq=(x,y)=>x===y||(x.length>=5&&y.length>=5&&lev(x,y)<=2);
function authorMatch(ours,theirs){
  const ot=norm(ours).split(' ').filter(x=>x.length>=2);
  if(!ot.length)return true;
  const tt=norm((theirs||[]).join(' ')).split(' ').filter(Boolean);
  const last=ot[ot.length-1];
  const hits=ot.filter(x=>tt.some(y=>tokEq(x,y))).length;
  return tt.some(y=>tokEq(last,y))||hits>=2;
}
function titleScore(ours,theirs){
  const A=norm(ours),B=norm(theirs);if(!A||!B)return 0;
  if(A===B)return 3;
  const a=A.split(' '),b=B.split(' ');
  const [sh,lo]=a.length<=b.length?[a,b]:[b,a];
  if(sh.every(x=>lo.includes(x))&&(sh.length>=2||lo.length<=3))return 2;
  const inter=sh.filter(x=>lo.includes(x)).length,uni=new Set([...a,...b]).size;
  return inter/uni>=0.6?1:0;
}
function pick(items,b){
  let best=null,bs=-1;
  for(const it of items){
    const v=it.volumeInfo||{};
    const ts=titleScore(b.t,v.title||'');if(!ts)continue;
    const am=authorMatch(b.a,v.authors);
    const sc=ts*2+(am?4:0)+(v.imageLinks?1:0);
    if(sc>bs){bs=sc;best={v,ts,am}}
  }
  if(!best)return null;
  const il=best.v.imageLinks||{};
  const img=(il.thumbnail||il.smallThumbnail||'').replace('http://','https://').replace('&edge=curl','');
  return {c:img,v:(best.am&&best.ts>=2)?'ok':'check',g:(best.v.title||'')+((best.v.authors||[]).length?' - '+best.v.authors.join(', '):'')};
}
async function gbFetch(q){
  const url='https://www.googleapis.com/books/v1/volumes?maxResults=10&q='+encodeURIComponent(q)+(GB_KEY?'&key='+GB_KEY:'');
  let r;
  for(let k=0;k<3;k++){
    r=await fetch(url);
    if(r.status!==429&&r.status!==403)break;
    await sleep(1500*(k+1));
  }
  if(r.status===429||r.status===403)throw GB_KEY&&r.status===403?'key':'rate';
  if(!r.ok)throw 'err';
  const j=await r.json();
  return j.items||[];
}
async function gbLookup(b){
  const qs=['intitle:'+b.t+(b.a?' inauthor:'+b.a:''),(b.t+' '+(b.a||'')).trim(),b.t];
  let all=[],res=null;
  for(let i=0;i<qs.length;i++){
    if(i)await sleep(700);
    try{all=all.concat(await gbFetch(qs[i]))}
    catch(e){if(e==='err'&&i>0)break;throw e}
    res=pick(all,b);
    if(res&&res.v==='ok'&&res.c)break;
  }
  return res?Object.assign({s:2},res):{c:'',v:'none',g:'',s:2};
}

function vchip(b){
  if(busy.has(b.id))return '<span class="chip">Aranıyor…</span>';
  if(b.v==='ok')return '<span class="chip ok">Doğrulandı</span>';
  if(b.v==='check')return '<span class="chip loan">Kontrol et</span>';
  if(b.v==='none')return '<span class="chip">Doğrulanamadı</span>';
  return '';
}
function persist(){
  if(!ref)return;const b=books.slice(),st=Object.assign({},set);
  saving=saving.then(()=>setDoc(ref,{books:b,set:st})).catch(e=>{toast('Kayıt yapılamadı. Sayfayı yenileyip tekrar dene.')});
}
function change(fn){fn();persist();render()}
let tt;
function toast(msg,undo){
  const t=$('toast');t.innerHTML=esc(msg)+(undo?' <button class="btn" id="tu">Geri al</button>':'');t.hidden=false;
  if(undo)$('tu').onclick=()=>{undo();t.hidden=true};
  clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},8000);
}
const TH={
 yesil:{n:'Yeşil',bg:'#eef5ee',card:'#fbfefb',ink:'#1f2f22',mute:'#5d7262',line:'#d3e3d4',acc:'#5f9f6d'},
 turuncu:{n:'Turuncu',bg:'#fbf1e6',card:'#fffaf4',ink:'#33261a',mute:'#80684f',line:'#f0dcc4',acc:'#e08a3c'},
 pembe:{n:'Pembe',bg:'#fbeef2',card:'#fffafb',ink:'#35212a',mute:'#80606c',line:'#f0d6df',acc:'#d9708f'},
 mavi:{n:'Mavi',bg:'#edf3fa',card:'#fafcff',ink:'#1c2a3a',mute:'#5a6e85',line:'#d3e0ef',acc:'#5b8fc7'},
 lavanta:{n:'Lavanta',bg:'#f3effa',card:'#fcfaff',ink:'#2a2238',mute:'#6e6285',line:'#e0d8ef',acc:'#8a74c0'},
 krem:{n:'Krem',bg:'#f7f1e4',card:'#fffdf7',ink:'#2d2a22',mute:'#7a725f',line:'#e8dfca',acc:'#a68a4a'}
};
function applyTheme(){
  const r=document.documentElement,t=TH[set.th],acc=set.acc||(t&&t.acc)||'#1f5f8b';
  const dk=!t&&(set.th==='dark'||(set.th!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches));
  r.dataset.theme=dk?'dark':'light';
  ['bg','card','ink','mute','line'].forEach(k=>t?r.style.setProperty('--'+k,t[k]):r.style.removeProperty('--'+k));
  r.style.setProperty('--acc',acc);
  const n=parseInt(acc.slice(1),16),lum=(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255;
  r.style.setProperty('--acc-ink',lum>0.6?'#111':'#fff');
  r.style.fontSize={k:'14px',o:'16px',b:'19px'}[set.fs||'o'];
}
function go(v,x){nav=Object.assign({v},x||{});qtext='';history.pushState(nav,'');render();scrollTo(0,0)}
addEventListener('popstate',e=>{nav=e.state||{v:'home',f:'all'};qtext='';render()});
const cov=(b,sz)=>b.c?`<img class="cov ${sz||''}" src="${esc(b.c)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;cov ${sz||''} ph&quot;></div>'">`:`<div class="cov ${sz||''} ph"></div>`;
const chips=b=>`${b.r?'<span class="chip ok">Okundu</span>':b.k?'<span class="chip loan">Okuyorum</span>':'<span class="chip">Okunmadı</span>'}${b.p?`<span class="chip">★ ${b.p}</span>`:''}${b.l?`<span class="chip loan">Ödünçte: ${esc(b.l.to)}</span>`:''}${vchip(b)}`;
const card=b=>`<div class="row" data-a="det" data-id="${esc(b.id)}">${cov(b)}<div class="grow"><div class="t">${esc(b.t)}</div><div class="a">${esc(b.a)||'Yazar yok'}</div><div class="acts">${chips(b)}</div></div></div>`;
const topbar=t=>`<div class="top"><button class="btn sm" data-a="back">Geri</button><h2>${t}</h2><span style="width:56px"></span></div>`;
const searchBox=()=>`<input class="inp" id="q" type="search" placeholder="Kitap veya yazar ara" autocomplete="off" aria-label="Kitap veya yazar ara" value="${esc(qtext)}">`;

function homeV(){
  const A=act();
  return `<div class="top"><h1>Kitaplığım</h1><button class="btn sm" data-a="prof">Profil</button></div>
  <div class="srow">${searchBox()}<button class="btn pri" data-a="add" style="padding:11px 12px">Kitap ekle</button></div>
  <div id="tiles">
  ${A.length?'':'<div class="empty">Kitaplık boş. Kitap ekleyebilir ya da Profil sayfasından CSV dosyası yükleyebilirsin.</div>'}
  <div class="grid">${Object.keys(F).map(f=>`<button class="tile" data-a="list" data-f="${f}"><b>${A.filter(F[f]).length}</b><span>${L[f]}</span></button>`).join('')}</div></div>
  <div id="res"></div>`;
}
function listV(){
  let sum='';
  if(nav.f==='loan'){
    const g={};act().filter(F.loan).forEach(b=>{g[b.l.to]=(g[b.l.to]||0)+1});
    const e=Object.entries(g);if(e.length)sum=`<div class="card2">${e.map(([k,v])=>esc(k)+': '+v+' kitap').join(', ')}</div>`;
  }
  return `${topbar(L[nav.f])}${searchBox()}
  <select class="inp" id="so" aria-label="Sırala"><option value="ad"${sortBy==='ad'?' selected':''}>Ada göre</option><option value="ya"${sortBy==='ya'?' selected':''}>Yazara göre</option><option value="son"${sortBy==='son'?' selected':''}>Son eklenen</option></select>
  ${sum}<div id="res"></div>`;
}
function detV(){
  const b=books.find(x=>x.id===nav.id&&!x.x);
  if(!b)return topbar('Kitap')+'<div class="empty">Kitap bulunamadı.</div>';
  const days=b.l?Math.max(0,Math.floor((Date.now()-new Date(b.l.d))/864e5)):0;
  return `${topbar('Kitap')}
  <div class="main">${cov(b,'lg')}<div class="grow"><div class="t big">${esc(b.t)}</div><div class="a">${esc(b.a)||'Yazar yok'}</div><div class="acts">${chips(b)}</div>${b.v==='check'&&b.g?`<div class="a">Bulunan: ${esc(b.g)}</div>`:''}</div></div>
  ${pend===b.id&&!hasU(b)?'<div class="banner">1000kitap sayfasında doğru kitabı açıp adresini kopyaladıysan bağlantıyı kaydedebilirsin.<div class="btns"><button class="btn pri" data-a="paste">Panodan ekle</button></div></div>':''}
  <div class="btns"><button class="btn pri" data-a="rd">${b.r?'Okunmadı yap':'Okundu yap'}</button>${b.r?'':`<button class="btn" data-a="rg">${b.k?'Okumayı bıraktım':'Şu an okuyorum'}</button>`}<button class="btn" data-a="loan">${b.l?'Geri aldım':'Ödünç ver'}</button></div>
  ${b.l?`<div class="card2">Ödünç: ${esc(b.l.to)}, ${fmt(b.l.d)}, ${days} gündür dışarıda</div>`:''}
  ${b.r?`<div class="card2"><label for="rdate">Okuma tarihi</label><input class="inp" type="date" id="rdate" value="${esc(b.rd||'')}"><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star ${b.p>=n?'on':''}" data-a="star" data-n="${n}" aria-label="${n} yıldız">★</button>`).join('')}</div></div>`:''}
  <div class="card2"><h3>Düşüncelerim ve notlarım</h3><div class="note">${b.n?esc(b.n):'Henüz not yok.'}</div></div>
  <div class="btns"><button class="btn" data-a="edit">Düzenle</button><a class="btn" href="${esc(kLink(b))}" ${hasU(b)?'':'data-k="1" '}target="_blank" rel="noopener noreferrer">${hasU(b)?"1000kitap'ta aç":"1000kitap'ta ara"}</a>${b.v==='ok'?'':'<button class="btn" data-a="cover">Kapak bul</button>'}<button class="btn del" data-a="del">Çıkar</button></div>`;
}
function profV(){
  const A=act(),rd=A.filter(b=>b.r),yr=String(new Date().getFullYear()),yc=rd.filter(b=>(b.rd||'').startsWith(yr)).length;
  const vc={ok:0,check:0,none:0,x:0};A.forEach(b=>{vc[['ok','check','none'].includes(b.v)?b.v:'x']++});
  const del=books.filter(b=>b.x),acc=set.acc||(TH[set.th]&&TH[set.th].acc)||'#1f5f8b';
  const sw=['#1f5f8b','#2c7a4b','#8a3b8f','#b3322b','#a9650f','#444b52'];
  return `${topbar('Profil')}
  <div class="card2"><b>${A.length}</b> kitap, <b>${rd.length}</b> okunan, bu yıl <b>${yc}</b> okunan</div>
  <h3>Veriler</h3>
  <div class="btns"><button class="btn" data-a="backup">Yedekle</button><button class="btn" data-a="restore">Yedekten yükle</button><button class="btn" data-a="csvin">CSV yükle</button><button class="btn" data-a="csvout">CSV olarak aktar</button></div>
  <h3>Tema</h3>
  <div class="btns">${[['auto','Cihaza göre'],['light','Açık'],['dark','Koyu']].concat(Object.keys(TH).map(k=>[k,TH[k].n])).map(([k,n])=>`<button class="btn thb" data-a="th" data-th="${k}" aria-pressed="${(set.th||'auto')===k}"${TH[k]?` style="background:${TH[k].bg};color:${TH[k].ink};border-color:${TH[k].acc}"`:''}>${n}</button>`).join('')}</div>
  <label>Vurgu rengi</label>
  <div class="btns">${sw.map(c=>`<button class="sw" style="background:${c}" data-a="sw" data-c="${c}" aria-label="Renk ${c}"></button>`).join('')}<input type="color" id="acc" value="${esc(acc)}" aria-label="Özel renk"></div>
  <label for="fs">Yazı boyutu</label><select class="inp" id="fs"><option value="k"${set.fs==='k'?' selected':''}>Küçük</option><option value="o"${(set.fs||'o')==='o'?' selected':''}>Orta</option><option value="b"${set.fs==='b'?' selected':''}>Büyük</option></select>
  <h3>Kapaklar</h3>
  <div class="a">Doğrulandı ${vc.ok}, Kontrol et ${vc.check}, Doğrulanamadı ${vc.none}, Aranmadı ${vc.x}</div>
  <div class="btns"><button class="btn" data-a="covers">Kapakları bul</button></div><div id="info">${scanMsg}</div>
  ${del.length?`<h3>Silinenler (7 gün sonra kalıcı silinir)</h3>`+del.map(b=>`<div class="card2"><div class="t">${esc(b.t)}</div><div class="a">${esc(b.a)}</div><div class="btns"><button class="btn" data-a="undel" data-id="${esc(b.id)}">Geri al</button></div></div>`).join(''):''}
  <button class="btn del wide" data-a="out" style="margin-top:20px">Çıkış</button>`;
}
function render(){
  applyTheme();
  if(!$('main')||$('main').hidden)return;
  $('view').innerHTML={home:homeV,list:listV,detail:detV,profile:profV}[nav.v]();
  fill();
}
function fill(){
  const res=$('res');if(!res||!['home','list'].includes(nav.v))return;
  const q=fold(qtext).trim();
  if(nav.v==='home')$('tiles').hidden=!!q;
  if(nav.v==='home'&&!q){res.innerHTML='';return}
  let l=act().filter(nav.v==='home'?F.all:F[nav.f]);
  if(q)l=l.filter(b=>fold(b.t).includes(q)||fold(b.a).includes(q)||fold(b.n).includes(q));
  const cmp=(x,y)=>String(x||'').localeCompare(String(y||''),'tr');
  l.sort(sortBy==='son'?(x,y)=>(y.ad||0)-(x.ad||0):sortBy==='ya'?(x,y)=>cmp(x.a,y.a)||cmp(x.t,y.t):(x,y)=>cmp(x.t,y.t));
  res.innerHTML=l.length?l.map(card).join(''):'<div class="empty">Sonuç bulunamadı.</div>';
}
async function enrich(id,manual){
  const b0=books.find(x=>x.id===id);if(!b0||busy.has(id))return;
  busy.add(id);render();
  try{const res=await gbLookup(b0);change(()=>{const c=books.find(x=>x.id===id);if(c)Object.assign(c,res)})}
  catch(e){if(manual)toast(e==='rate'?'Google Books arama sınırına ulaşıldı. Biraz bekleyip tekrar dene.':e==='key'?'Google Books anahtarı kabul edilmedi.':'Kapak aranamadı. İnternet bağlantını kontrol et.')}
  finally{busy.delete(id);render()}
}
const msg=h=>{scanMsg=h;const e=$('info');if(e)e.innerHTML=h};
async function scan(){
  const todo=books.filter(b=>!b.x&&b.v!=='ok'&&b.s!==2).map(b=>b.id);
  if(!todo.length){alert('Aranacak kitap kalmadı.');return}
  if(!confirm('Doğrulanmamış '+todo.length+' kitap aranacak. Bu birkaç dakika sürebilir, sayfayı kapatma. Başlayalım mı?'))return;
  const out=new Map();let stop='';
  for(let i=0;i<todo.length&&!stop;i++){
    const b=books.find(x=>x.id===todo[i]);if(!b)continue;
    msg('<div class="banner">Aranıyor: '+(i+1)+' / '+todo.length+'</div>');
    let tries=0;
    while(true){
      try{out.set(b.id,await gbLookup(b));break}
      catch(e){
        if(e==='rate'&&tries<2){tries++;for(let s=65;s>0;s--){msg('<div class="banner">Google sınırına takıldı, '+s+' sn bekleniyor ('+(i+1)+' / '+todo.length+')</div>');await sleep(1000)}continue}
        if(e==='rate'||e==='key')stop=e;
        break;
      }
    }
    await sleep(900);
  }
  if(out.size)change(()=>{out.forEach((res,id)=>{const c=books.find(x=>x.id===id);if(c)Object.assign(c,res)})});
  msg('<div class="banner">'+out.size+' kitap tarandı.'+(stop==='rate'?' Google Books arama sınırına ulaşıldı. Biraz bekleyip veya yarın tekrar bas, kaldığı yerden devam eder.':stop==='key'?' Google Books anahtarı kabul edilmedi, kısıtlamalarını kontrol et.':'')+'</div>');
}

function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const d=first.split(';').length>first.split(',').length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else if(c==='"')q=true;
    else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);rows.push(row);row=[];cur='' }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x));
}

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const bk=id=>books.find(x=>x.id===id);

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id||nav.id,b=bk(id);
  switch(a){
    case 'prof':go('profile');break;
    case 'back':(nav.v!=='home'&&history.length>1)?history.back():go('home');break;
    case 'list':go('list',{f:el.dataset.f});break;
    case 'det':go('detail',{id});break;
    case 'add':$('addT').value='';$('addA').value='';$('dAdd').showModal();$('addT').focus();break;
    case 'rd':if(b)change(()=>{b.r=!b.r;if(b.r){b.rd=today();b.k=false}else b.rd=''});break;
    case 'rg':if(b)change(()=>{b.k=!b.k});break;
    case 'loan':if(!b)break;target=b;if(b.l)change(()=>{b.l=null});else{$('loanBook').textContent=b.t;$('loanTo').value='';$('loanD').value=today();$('dLoan').showModal()}break;
    case 'edit':if(!b)break;target=b;$('edT').value=b.t;$('edA').value=b.a||'';$('edU').value=b.u||'';$('edN').value=b.n||'';$('dEdit').showModal();break;
    case 'cover':enrich(id,true);break;
    case 'paste':(async()=>{try{const tx=await navigator.clipboard.readText();const m=(tx||'').match(/https?:\/\/[^\s]+/);const u=m?m[0].replace(/^http:/,'https:'):'';if(b&&okUrl(u)){change(()=>{b.u=u});pend='';toast('Bağlantı kaydedildi.')}else toast('Panoda 1000kitap bağlantısı bulamadım.')}catch(err){toast('Panoya erişilemedi. Düzenle penceresine yapıştırabilirsin.')}})();break;
    case 'star':if(b){const n=+el.dataset.n;change(()=>{b.p=b.p===n?0:n})}break;
    case 'del':if(b){change(()=>{b.x=Date.now()});toast('Kitap çıkarıldı.',()=>change(()=>{b.x=0}));(history.length>1)?history.back():go('home')}break;
    case 'undel':if(b)change(()=>{b.x=0});break;
    case 'th':change(()=>{set.th=el.dataset.th;delete set.acc});break;
    case 'sw':change(()=>{set.acc=el.dataset.c});break;
    case 'backup':dl('kitaplik-yedek.json',JSON.stringify(books,null,1),'application/json');break;
    case 'restore':$('file').click();break;
    case 'csvin':$('csv').click();break;
    case 'csvout':{const q=x=>'"'+String(x||'').replace(/"/g,'""')+'"';
      dl('kitaplik.csv','\uFEFF'+['Kitap;Yazar;Okundu;Not'].concat(act().map(b=>[q(b.t),q(b.a),b.r?'okundu':'',q(b.n)].join(';'))).join('\r\n'),'text/csv');break}
    case 'covers':scan();break;
    case 'out':signOut(auth);break;
  }
});
document.addEventListener('click',e=>{const k=e.target.closest('a[data-k]');if(k&&nav.v==='detail')pend=nav.id},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&pend&&nav.v==='detail')render()});
document.addEventListener('input',e=>{if(e.target.id==='q'){qtext=e.target.value;fill()}});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  if(id==='so'){sortBy=t.value;fill()}
  else if(id==='rdate'){const b=bk(nav.id);if(b)change(()=>{b.rd=t.value})}
  else if(id==='acc')change(()=>{set.acc=t.value});
  else if(id==='fs')change(()=>{set.fs=t.value});
});
document.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',e=>e.target.closest('dialog').close()));
$('addOk').onclick=()=>{
  const t=$('addT').value.trim();if(!t){$('addT').focus();return}
  const nb={id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t,a:$('addA').value.trim(),n:'',r:false,l:null,ad:Date.now()};
  change(()=>{books.push(nb)});$('dAdd').close();enrich(nb.id);
};
$('loanOk').onclick=()=>{const to=$('loanTo').value.trim();if(!to){$('loanTo').focus();return}change(()=>{target.l={to,d:$('loanD').value||today()}});$('dLoan').close()};
$('edOk').onclick=()=>{
  const t=$('edT').value.trim();if(!t){$('edT').focus();return}
  const a2=$('edA').value.trim(),u2=$('edU').value.trim();
  if(u2&&!okUrl(u2)){alert('Bağlantı https://1000kitap.com ile başlayan bir adres olmalı.');return}
  const ch=t!==target.t||a2!==(target.a||'');
  change(()=>{target.t=t;target.a=a2;target.n=$('edN').value.trim();target.u=u2;if(ch){target.c='';target.v='';target.g='';target.s=0}});
  $('dEdit').close();if(ch)enrich(target.id);
};
$('csv').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const rows=parseCSV(await f.text());
  if(rows.length&&fold(rows[0][0]).startsWith('kitap'))rows.shift();
  const key=(t,a)=>fold(t).trim()+'|'+fold(a).trim();
  const have=new Set(books.map(b=>key(b.t,b.a)));const add=[];let skipped=0;
  rows.forEach((r,i)=>{
    const t=r[0]||'',a=r[1]||'';if(!t)return;
    const k=key(t,a);if(have.has(k)){skipped++;return}
    have.add(k);
    add.push({id:'c'+Date.now().toString(36)+i,t,a,n:r[3]||'',r:['okundu','evet','1','true'].includes(fold(r[2]||'')),l:null,ad:Date.now()});
  });
  if(!add.length&&!skipped){alert('Dosyada kitap bulunamadı. İlk sütun kitap adı, ikinci sütun yazar olmalı.');return}
  if(add.length)change(()=>{books=books.concat(add)});
  alert(add.length+' kitap eklendi'+(skipped?', '+skipped+' kitap zaten kayıtlıydı.':'.'));
};
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const arr=JSON.parse(await f.text());
    if(!Array.isArray(arr)||!arr.every(b=>b&&typeof b.t==='string'))throw 0;
    if(confirm('Kitaplığındaki '+act().length+' kitabın yerine yedekteki '+arr.length+' kayıt yüklensin mi?'))change(()=>{books=arr});
  }catch(err){alert('Bu dosya bir kitaplık yedeği gibi görünmüyor.')}
};
const errTxt={'auth/invalid-credential':'E-posta veya parola hatalı.','auth/invalid-email':'E-posta adresi geçersiz.','auth/too-many-requests':'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.','auth/network-request-failed':'İnternet bağlantısı yok.'};
async function login(){
  $('lgErr').hidden=true;
  try{await signInWithEmailAndPassword(auth,$('lgE').value.trim(),$('lgP').value)}
  catch(e){$('lgErr').textContent=errTxt[e.code]||'Giriş yapılamadı ('+(e.code||'bilinmeyen hata')+').';$('lgErr').hidden=false}
}
$('lgGo').onclick=login;
$('lgP').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme());

history.replaceState(nav,'');
onAuthStateChanged(auth,user=>{
  if(unsub){unsub();unsub=null}
  if(!user){ref=null;books=[];set={};$('main').hidden=true;$('login').hidden=false;applyTheme();return}
  $('login').hidden=true;$('main').hidden=false;$('lgP').value='';
  ref=doc(fdb,'library','main');
  unsub=onSnapshot(ref,snap=>{
    const d=snap.exists()?snap.data():null;
    books=d&&Array.isArray(d.books)?d.books:[];set=(d&&d.set)||{};
    if(!purged){purged=true;const old=books.filter(b=>b.x&&Date.now()-b.x>6048e5);if(old.length){books=books.filter(b=>!old.includes(b));persist()}}
    render();
  },()=>{toast('Kitaplığa erişilemedi. İnternetini ve güvenlik kuralını kontrol et.')});
});
applyTheme();
