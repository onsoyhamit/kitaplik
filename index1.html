<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kitaplığım</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a1310"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root,[data-t=gece]{--bg:#1a1310;--p:#2a201a;--ac:#e8a23a;--ro:#c97b84;--tx:#f3e9dc;--mu:#c9b8a6;--fa:#8f7d6c;--on:#1a1310;--ln:#3a2e24}
[data-t=orman]{--bg:#111a14;--p:#1c2a20;--ac:#9bc46b;--ro:#d89a6a;--tx:#e8f0e3;--mu:#a9bda9;--fa:#6f8a72;--on:#0f1610;--ln:#2a3d2f}
[data-t=okyanus]{--bg:#0e1a24;--p:#17293a;--ac:#5fb8c9;--ro:#e0a58f;--tx:#e6f1f6;--mu:#a3bcc9;--fa:#6e8c9c;--on:#0b1620;--ln:#243d52}
[data-t=kagit]{--bg:#f6f0e6;--p:#ece3d4;--ac:#b5651d;--ro:#a8535e;--tx:#2a201a;--mu:#6b5a4a;--fa:#9a8a78;--on:#fff;--ln:#d9cdbb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--tx);font:1em/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 0}
h1,h2,.hs{font-family:Fraunces,Georgia,"Times New Roman",serif;color:var(--ac);margin:0;font-weight:600}
.pg{flex:1;padding:18px 22px 96px;animation:in .35s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.c{text-align:center}.mu{color:var(--mu)}.fa{color:var(--fa)}.sm{font-size:12.5px}
button,input,textarea{font:inherit;color:inherit}
.b{display:block;width:100%;border:0;border-radius:14px;padding:13px;background:var(--p);color:var(--tx);margin:0 0 10px;cursor:pointer;text-align:center}
.b.p{background:var(--ac);color:var(--on);font-weight:600}.b.o{background:none;box-shadow:inset 0 0 0 1px var(--ac);color:var(--ac)}.b.d{background:var(--ro);color:var(--on);font-weight:600}.b.r{color:var(--ro)}
.row2{display:flex;gap:10px}.row2>.b{flex:1}
label{display:block;font-size:12.5px;color:var(--mu);margin:0 0 12px}
input,textarea{display:block;width:100%;margin-top:5px;padding:12px;border:0;border-radius:12px;background:var(--p);outline:0}
input:focus,textarea:focus{box-shadow:0 0 0 2px var(--ac)}
input.er{box-shadow:0 0 0 1.5px var(--ro)}
.er-t{color:var(--ro);font-size:12px;margin:-6px 0 10px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ib{width:36px;height:36px;border-radius:18px;border:0;background:var(--p);cursor:pointer;font-size:17px}
.sr{display:flex;gap:10px;margin:16px 0 0}.sr input{margin:0;border-radius:22px;padding:12px 16px}
.add{width:46px;height:46px;flex:none;border:0;border-radius:23px;background:var(--ac);color:var(--on);font-size:24px;cursor:pointer}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.tl{background:var(--p);border:0;border-radius:18px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:14px}.tl i{font-style:normal;color:var(--ac);font-size:20px}.tl.r i{color:var(--ro)}
.rw{display:flex;gap:14px;align-items:center;padding:8px 0;cursor:pointer}
.cv{width:52px;height:74px;border-radius:5px;background:var(--ro);flex:none;box-shadow:0 3px 8px #0004}.cv.l{width:128px;height:180px;transform:rotate(-3deg);border-radius:8px}
.chp{display:inline-block;padding:6px 12px;border-radius:14px;background:var(--p);color:var(--mu);font-size:12.5px;margin:0 6px 6px 0;cursor:pointer;border:0}.chp.on{background:var(--ac);color:var(--on)}
.cd{background:var(--p);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:inset 0 0 0 1px var(--ln)}.cd h2{font-size:17px}
.tp{background:var(--p);margin:-18px -22px 18px;padding:18px 22px;border-radius:0 0 26px 26px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--fa);font-size:11px;cursor:pointer}nav button i{display:block;font-style:normal;font-size:20px}nav .on{color:var(--ac)}
.fl{display:inline-block;font-size:48px;animation:fl 3.2s ease-in-out infinite}.fl.b2{animation-delay:-1.4s;color:var(--ro)}
@keyframes fl{50%{transform:translateY(-9px)}}
.pu{animation:pu 1.8s infinite}@keyframes pu{0%,100%{box-shadow:0 0 0 0 #e8a23a88}50%{box-shadow:0 0 0 10px #e8a23a00}}
.dts span{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--fa);margin:0 3px;transition:.3s}.dts .on{width:20px;background:var(--ac)}
.tc{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:14px;padding:14px;background:var(--p);margin-bottom:8px;cursor:pointer}.tc.on{box-shadow:inset 0 0 0 2px var(--ac)}
.tc i{display:inline-block;width:14px;height:14px;border-radius:7px;margin-left:4px}
#toast{position:fixed;left:16px;right:16px;bottom:84px;max-width:488px;margin:auto;background:var(--tx);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;justify-content:space-between;z-index:9}
.off{background:var(--p);color:var(--ro);text-align:center;padding:8px;font-size:12.5px}
.hn{background:#e8a23a22;color:var(--ac);border-radius:16px;padding:12px;margin-bottom:14px;font-size:13px}.hn button{margin-top:8px;border:0;border-radius:12px;padding:8px 14px;background:var(--ac);color:var(--on);cursor:pointer}
.sh{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--p) 40%,transparent) 0 9px,transparent 9px 14px,color-mix(in srgb,var(--p) 40%,transparent) 14px 20px,transparent 20px 25px) top/100% 160px no-repeat}
.ti{line-height:1;vertical-align:-.12em}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onIdTokenChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,updateProfile,deleteUser,sendEmailVerification,sendPasswordResetEmail,EmailAuthProvider,reauthenticateWithCredential} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const fapp=initializeApp({apiKey:"AIzaSyDXUBmcjysOB9-JEXDvJGQXLKJmdK9EmP0",authDomain:"kitapligim55.firebaseapp.com",projectId:"kitapligim55",storageBucket:"kitapligim55.firebasestorage.app",messagingSenderId:"930194490379",appId:"1:930194490379:web:b3c6a1c8d1f755a2db730e"});
const auth=getAuth(fapp);auth.languageCode='tr';
let fdb;try{fdb=initializeFirestore(fapp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fdb=getFirestore(fapp)}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s||'').replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase().replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
const okPw=p=>p.length>=6&&/\p{L}/u.test(p)&&/\p{N}/u.test(p)&&/\p{P}/u.test(p);
const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=t=>new Date(t).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
const FL={all:['Tüm kitaplar',()=>1],read:['Okunan',b=>b.r],unread:['Okunmayan',b=>!b.r],loan:['Ödünçte',b=>b.l],notes:['Notlu',b=>b.n]};
let pend='',user=null,ref=null,unsub=null,books=[],set={},v='boot',f='all',q='',cur=null,sl=0,err='',sent=0,qs=0;
const act=()=>books.filter(b=>!b.x),get=id=>books.find(b=>b.id===id);
const cvs=b=>b.c?`background:url(${esc(b.c)}) center/cover`:`background:${b.r?'var(--ac)':'var(--ro)'}`;
const dl=(bl,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=n;a.click()};
async function find(b){const q=b.isbn?'isbn:'+b.isbn:'intitle:'+b.t+(b.a?'+inauthor:'+b.a:'');try{const r=await(await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=1&q='+encodeURIComponent(q).replace(/%2B/g,'+'))).json();const i=r.items?.[0]?.volumeInfo;return i?{t:i.title,a:(i.authors||[]).join(', '),c:(i.imageLinks?.thumbnail||'').replace('http:','https:')}:null}catch(e){return null}}
const parse=t=>{const o=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){t[i+1]=='"'?(c+='"',i++):q=0}else c+=h}else if(h=='"')q=1;else if(h==','||h==';'){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';o.push(r);r=[]}else c+=h}if(c||r.length){r.push(c);o.push(r)}return o};
const theme=t=>{document.documentElement.dataset.t=t||'gece';localStorage.th=t||'gece'};theme(localStorage.th);document.documentElement.style.fontSize=localStorage.fs||'16px';
const persist=()=>ref&&setDoc(ref,{books,set}).catch(()=>toast('Kaydedilemedi. İnternetini kontrol et.'));
function toast(m,u){const t=$('toast');t.innerHTML=`<span>${esc(m)}</span>${u?'<b data-a="undo" style="color:#b5651d;cursor:pointer">Geri al</b>':''}`;t.style.display='flex';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',u?6000:3000);toast.u=u}
const rows=l=>l.map(b=>`<div class="rw" data-a="open" data-v="${esc(b.id)}"><span class="cv" style="width:40px;height:57px;${cvs(b)}"></span><div><div style="font-weight:600">${esc(b.t)}</div><div class="fa sm">${esc(b.a)}${b.l?' · '+esc(b.l.to)+'\'de':''}</div></div></div>`).join('');
const NV=()=>`<nav>${[['home','home','Ana sayfa'],['all','search','Ara'],['prof','user','Profil']].map(x=>`<button data-a="go" data-v="${x[0]}" class="${v===x[0]?'on':''}"><i class="ti ti-${x[1]}"></i>${x[2]}</button>`).join('')}</nav>`;
const hd=(t,r='')=>`<div class="hd"><button class="ib" data-a="back" aria-label="Geri"><i class="ti ti-arrow-left"></i></button><h2>${t}</h2><span style="width:36px">${r}</span></div>`;
const fi=(id,l,val='',type='text',x='')=>`<label>${l}<input id="${id}" type="${type}" value="${esc(val)}" ${x}></label>`;
const PRIV='Ad, e-posta, kullanıcı kimliği, hesap oluşturma zamanı, kitap bilgilerin, notların ve ayarların Firebase (Google) üzerinde senin hesabına bağlı saklanır. Kapak/bilgi aramalarında kitap başlığı, yazar veya ISBN, Google Books servisine gönderilir. Verilerini Profil\'den yedekleyebilir, hesabını sildiğinde kitaplığın ve hesap kaydın silinir.';
const OB=[['books','book-2','Kitaplığın cebinde','Okuduklarını, ödünç verdiklerini ve notlarını tek yerde tut.'],['arrows-exchange','','Ödünç takibi','Kime hangi kitabı verdiğini ve ne zaman verdiğini kaydet.'],['note','camera','Notlar ve bağlantılar','Düşüncelerini yaz, kitabı 1000kitap\'ta bul ve bağlantısını sakla.']];
const V={
boot:()=>`<div class="pg c sh" style="display:grid;place-content:center"><h1 style="font-size:32px">Kitaplığım</h1><p class="mu">Yükleniyor…</p></div>`,
ob:()=>{const o=OB[sl];return `<div class="pg c sh" style="display:flex;flex-direction:column"><div style="margin-top:18vh"><span class="fl"><i class="ti ti-${o[0]}"></i></span>${o[1]?`<span class="fl b2"><i class="ti ti-${o[1]}"></i></span>`:''}</div><h1 style="margin-top:20px">${o[2]}</h1><p class="mu">${o[3]}</p><div style="flex:1"></div><div class="dts">${OB.map((_,i)=>`<span class="${i===sl?'on':''}"></span>`).join('')}</div><br><button class="b p" data-a="obn">${sl<2?'Devam et':'Başla'}</button>${sl<2?'<button class="b" style="background:none;color:var(--mu)" data-a="obs">Atla</button>':''}</div>`},
login:()=>`<div class="pg"><h1 style="margin:40px 0 24px;text-align:center">Giriş yap</h1>${fi('em','E-posta','','email','autocomplete=email')}${fi('pw','Parola','','password','autocomplete=current-password')}${err?`<div class="er-t">${esc(err)}</div>`:''}<button class="b p" data-a="login">Giriş yap</button><p class="c"><a href="#" data-a="to" data-v="reset" style="color:var(--ac)">Parolamı unuttum</a></p><p class="c mu">Hesabın yok mu? <a href="#" data-a="to" data-v="reg" style="color:var(--ac)">Kayıt ol</a></p></div>`,
reg:()=>`<div class="pg"><h1 style="margin:20px 0 20px;text-align:center">Hesap oluştur</h1>${fi('nm','Ad','','text','autocomplete=name')}${fi('em','E-posta','','email','autocomplete=email')}${fi('pw','Parola','','password','autocomplete=new-password')}${fi('pw2','Parola tekrar','','password','autocomplete=new-password')}<p class="fa sm" style="margin:-4px 0 12px">En az 6 karakter; harf, rakam ve noktalama işareti içermeli.</p>${err?`<div class="er-t">${esc(err)}</div>`:''}<label style="display:flex;gap:10px;align-items:center"><input id="kv" type="checkbox" style="width:18px;margin:0">Gizlilik politikasını kabul ediyorum.</label><details class="cd sm mu" style="margin-top:-2px"><summary style="cursor:pointer;color:var(--ac)">Gizlilik politikasını oku</summary><div style="margin-top:8px">${PRIV}</div></details><button class="b p" data-a="reg">Hesap oluştur</button><p class="c mu">Zaten hesabın var mı? <a href="#" data-a="to" data-v="login" style="color:var(--ac)">Giriş yap</a></p></div>`,
reset:()=>`<div class="pg"><h1 style="margin:40px 0 12px;text-align:center">Parolanı sıfırla</h1><p class="mu c">Kayıtlı e-postanı gir, sıfırlama bağlantısı gönderelim.</p>${fi('em','E-posta','','email')}${err?`<div class="er-t">${esc(err)}</div>`:''}<button class="b p" data-a="reset">Bağlantı gönder</button><p class="c"><a href="#" data-a="to" data-v="login" style="color:var(--ac)">Girişe dön</a></p></div>`,
verify:()=>`<div class="pg c"><div style="margin-top:14vh"><span class="fl"><i class="ti ti-mail"></i></span></div><h1>E-postanı doğrula</h1><p class="mu">${esc(user?.email)} adresine doğrulama bağlantısı gönderdik.</p><div class="cd sm" style="text-align:left">Mail gelmediyse <b>spam</b> (gereksiz) klasörünü kontrol et.</div><button class="b p" data-a="chk">Doğruladım, devam et</button><button class="b" data-a="resend">Tekrar gönder</button><button class="b" style="background:none;color:var(--mu)" data-a="out">Çıkış yap</button></div>`,
home:()=>{const a=act();if(!a.length)return `<div class="pg c sh"><div style="margin-top:12vh"><span class="fl"><i class="ti ti-books"></i></span><span class="fl b2"><i class="ti ti-book-2"></i></span></div><h1 style="margin-top:18px">Kitaplığın henüz boş</h1><p class="mu">İlk kitabını ekleyerek kendi kütüphaneni kurmaya başla.</p><button class="b p pu" data-a="add" style="margin-top:24px">İlk kitabını ekle <i class="ti ti-arrow-right"></i></button></div>${NV()}`;
return `<div class="pg"><h1 class="c" style="font-size:30px;margin-top:6px">Kitaplığım</h1><div class="sr"><input placeholder="Kitap veya yazar ara" data-a="hq" aria-label="Ara"><button class="add" data-a="add" aria-label="Kitap ekle"><i class="ti ti-plus"></i></button></div><p class="c mu" style="margin:16px 0 0">Toplam ${a.length} kitap</p><div class="gr">${[['read','check','Okunan',''],['unread','book-2','Okunmayan','r'],['loan','arrows-exchange','Ödünçte',''],['notes','note','Notlu','r']].map(x=>`<button class="tl ${x[3]}" data-a="flt" data-v="${x[0]}"><i class="ti ti-${x[1]}"></i>${x[2]}</button>`).join('')}</div><div class="mu">Son eklenenler</div>${rows(a.slice().sort((x,y)=>y.ad-x.ad).slice(0,5))}</div>${NV()}`},
all:()=>{const a=act().filter(FL[f][1]).filter(b=>!q||fold(b.t+' '+b.a).includes(fold(q))).sort((x,y)=>fold(x.t).localeCompare(fold(y.t),'tr'));return `<div class="pg"><div class="hd"><span style="width:36px"></span><h2>${FL[f][0]==='Tüm kitaplar'?'Ara':FL[f][0]}</h2><span style="width:36px"></span></div><input id="qq" placeholder="Kitap veya yazar ara" value="${esc(q)}" data-a="sq" style="border-radius:22px;padding:12px 16px;margin:0 0 12px">${Object.keys(FL).map(k=>`<button class="chp ${k===f?'on':''}" data-a="flt" data-v="${k}">${FL[k][0]==='Tüm kitaplar'?'Tümü':FL[k][0]}</button>`).join('')}<p class="fa sm">${a.length} kitap</p>${a.length?rows(a):`<div class="c" style="margin-top:40px"><i class="ti ti-search-off" style="font-size:44px;color:var(--ac)"></i><h2>Sonuç bulunamadı</h2><p class="mu">Başlığı ya da yazarı değiştirmeyi dene.</p><button class="b p" data-a="add">Yeni kitap ekle</button></div>`}</div>${NV()}`},
add:()=>{const b=cur?get(cur):null;return `<div class="pg">${hd(b?'Kitabı düzenle':'Kitap ekle')}${fi('t','Başlık',b?.t,'text','autofocus')}${fi('a','Yazar',b?.a)}${fi('i','ISBN-13 (isteğe bağlı)',b?.isbn,'text','inputmode=numeric')}${fi('d','Eklenme tarihi',iso(b?.ad||Date.now()),'date')}<p class="fa sm" style="margin:-4px 0 14px">Tarih otomatik eklendi. İstersen değiştirebilirsin.</p>${err?`<div class="er-t">${esc(err)}</div>`:''}<button class="b" data-a="scan">ISBN tara</button><button class="b p" data-a="save">Kaydet</button><button class="b" data-a="back">Vazgeç</button></div>`},
det:()=>{const b=get(cur);if(!b)return V.home();const u='https://1000kitap.com/';return `<div class="pg"><div class="tp"><button class="ib" data-a="back" style="position:absolute;left:18px;top:calc(18px + env(safe-area-inset-top))" aria-label="Geri"><i class="ti ti-arrow-left"></i></button><div class="cv l" style="margin:6px auto;${cvs(b)}"></div><p style="margin:12px 0">● ${b.r?'Okundu':b.k?'Şu an okuyorum':'Okunmadı'}</p><div class="row2"><button class="b p" data-a="rd">${b.r?'Okunmadı yap':'Okundu yap'}</button><button class="b o" data-a="rk">Şu an okuyorum</button></div></div><h1 style="font-size:26px">${esc(b.t)}</h1><p class="mu" style="margin:4px 0 10px">${esc(b.a)}</p>${b.isbn?`<code class="fa sm">ISBN-13 ${esc(b.isbn)}</code>`:''}<p class="fa sm">Eklenme: ${fmt(b.ad)}</p>
<div class="cd">${b.l?`<h2>${esc(b.l.to)}'de</h2><p class="mu sm">${fmt(b.l.d)}'ten beri</p><button class="b p" data-a="back2">Geri aldım</button>`:`<h2>Ödünç takibi</h2><p class="mu sm">Bu kitabı birine verdiğinde takibe al.</p><div id="ln" hidden>${fi('lt','Kime')}${fi('ld','Tarih',iso(Date.now()),'date')}<button class="b p" data-a="ln">Kaydet</button></div><button class="b" id="lb" data-a="lopen">Ödünç ver</button>`}</div>
<div class="cd"><h2>Notlarım</h2><p class="mu sm">Düşüncelerini burada sakla.</p><textarea id="nt" rows="4" placeholder="Bu kitap hakkında ne düşünüyorsun?">${esc(b.n)}</textarea><button class="b p" style="margin-top:10px" data-a="nsave">Notu kaydet</button></div>
${b.u?'':`<div class="hn">1000kitap sayfasında doğru kitabı açıp adresini kopyaladıysan bağlantıyı kaydedebilirsin.<br><button data-a="paste">Panodan ekle</button></div>`}

function render(){const off=navigator.onLine?'':'<div class="off">Çevrimdışısın. Değişiklikler bağlantı gelince eşitlenecek.</div>';$('app').innerHTML=off+(V[v]||V.home)();if(v==='all'&&qs){const e=$('qq');e&&(e.focus(),e.setSelectionRange(99,99));qs=0}}
const val=id=>($(id)?.value||'').trim(),fail=m=>{err=m;render()},go=(n)=>{v=n;err='';render();scrollTo(0,0)};
const A={
obn(){sl<2?(sl++,render()):A.obs()},obs(){localStorage.ob=1;go(user?'home':'login')},
to:x=>go(x),go:x=>{if(x==='all'){f='all';q=''}go(x)},back(){go(v==='bin'?'prof':cur&&v==='add'&&get(cur)?'det':'home')},
async login(){try{await signInWithEmailAndPassword(auth,val('em'),$('pw').value)}catch(e){fail('E-posta veya parola hatalı.')}},
async reg(){const p=$('pw').value,e=val('em');if(!val('nm')||!e)return fail('Ad ve e-posta gerekli.');if(!okPw(p))return fail('Parola kuralına uymuyor.');if(p!==$('pw2').value){$('pw2').classList.add('er');return fail('Parolalar eşleşmiyor. Tekrar kontrol et.')}if(!$('kv').checked)return fail('Gizlilik politikasını kabul etmelisin.');
try{const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:val('nm')});await setDoc(doc(fdb,'users',c.user.uid),{uid:c.user.uid,createdAt:Date.now()});await sendEmailVerification(c.user);v='verify';render()}catch(x){fail(x.code==='auth/email-already-in-use'?'Bu e-posta zaten kayıtlı.':'Hesap oluşturulamadı.')}},
async reset(){try{await sendPasswordResetEmail(auth,val('em'));go('login');toast('Bağlantı gönderildi. Spam klasörünü de kontrol et.')}catch(e){fail('Bağlantı gönderilemedi.')}},
async chk(){await user.reload();await user.getIdToken(true);start(auth.currentUser)},
async resend(){if(Date.now()-sent<30000)return toast('Biraz bekle, sonra tekrar dene.');sent=Date.now();try{await sendEmailVerification(user);toast('Bağlantı tekrar gönderildi.')}catch(e){toast('Gönderilemedi.')}},
out(){signOut(auth)},
add(){cur=null;go('add')},open(x){cur=x;go('det')},edit(){go('add')},
flt(x){f=x;q='';go('all')},hq(){},sq(x,el){q=el.value;qs=1;render()},
save(){const t=val('t');if(!t)return fail('Başlık gerekli.');const ad=new Date($('d').value+'T12:00:00').getTime()||Date.now();let b=cur&&get(cur);if(b)Object.assign(b,{t,a:val('a'),isbn:val('i'),ad});else{b={id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t,a:val('a'),isbn:val('i'),n:'',r:false,l:null,ad};books.unshift(b)}if(pend){b.c=pend;pend=''}cur=b.id;persist();go('det')},
rd(){const b=get(cur);b.r=!b.r;if(b.r)b.k=false;persist();render()},rk(){const b=get(cur);b.k=!b.k;if(b.k)b.r=false;persist();render()},
lopen(){$('ln').hidden=false;$('lb').hidden=true},ln(){const t=val('lt');if(!t)return toast('Kime verdiğini yaz.');get(cur).l={to:t,d:new Date($('ld').value+'T12:00:00').getTime()||Date.now()};persist();render()},back2(){get(cur).l=null;persist();render()},
nsave(){get(cur).n=$('nt').value.trim();persist();toast('Not kaydedildi.')},
k1(){const b=get(cur);open(b.u||'https://1000kitap.com/ara?q='+encodeURIComponent(b.t+' '+b.a),'_blank','noopener')},
async paste(){try{const s=(await navigator.clipboard.readText()).trim();if(!/^https:\/\/(www\.)?1000kitap\.com\//.test(s))return toast('Panoda 1000kitap adresi yok.');get(cur).u=s;persist();render();toast('Bağlantı kaydedildi.')}catch(e){toast('Panoya erişim izni gerekli.')}},
del(){const b=get(cur);b.x=Date.now();persist();go('home');toast('Kitap silindi.',1);toast.id=b.id},
undo(){const b=get(toast.id);if(b){delete b.x;persist();render()}$('toast').style.display='none'},
th(x){theme(x);set.th=x;persist();render()},
bak(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({books,set},null,1)],{type:'application/json'}));a.download='kitaplik-yedek-'+iso(Date.now())+'.json';a.click()},
fs(x){localStorage.fs=x;set.fs=x;persist();document.documentElement.style.fontSize=x;render()},
rest(x){delete get(x).x;persist();render()},
async cover(){const b=get(cur);toast('Kapak aranıyor…');const i=await find(b);if(i&&i.c){b.c=i.c;persist();render();toast('Kapak bulundu.')}else toast('Kapak bulunamadı.')},
async bulk(){const l=act().filter(b=>!b.c);if(!l.length)return toast('Tüm kitapların kapağı var.');let n=0;for(const b of l){toast('Taranıyor '+(++n)+' / '+l.length);const i=await find(b);if(i&&i.c)b.c=i.c;if(n%10==0)persist()}persist();render();toast('Tarama bitti.')},
csv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';dl(new Blob(['\ufeff'+['Başlık,Yazar,Okundu,Not,ISBN',...act().map(b=>[b.t,b.a,b.r?'evet':'hayır',b.n,b.isbn].map(q).join(','))].join('\r\n')],{type:'text/csv'}),'kitaplik-'+iso(Date.now())+'.csv')},
imp(){$('fi').click()},
async scan(){if(!('BarcodeDetector' in window))return toast('Bu cihaz barkod okumayı desteklemiyor. ISBN\'yi elle yaz.');let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast('Kamera izni gerekli.')}
const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column';m.innerHTML='<video autoplay playsinline muted style="flex:1;width:100%;object-fit:cover"></video><button class="b" style="margin:16px;width:auto">Vazgeç</button>';document.body.append(m);const vd=m.querySelector('video');vd.srcObject=s;const stop=()=>{s.getTracks().forEach(t=>t.stop());m.remove()};m.querySelector('button').onclick=stop;const d=new BarcodeDetector({formats:['ean_13']});
(async function lp(){if(!m.isConnected)return;try{const r=await d.detect(vd);const c=r[0]?.rawValue;if(c){stop();$('i').value=c;toast('ISBN okundu, bilgiler aranıyor…');const i=await find({isbn:c});if(i){if(!val('t'))$('t').value=i.t||'';if(!val('a'))$('a').value=i.a||'';pend=i.c||''}return}}catch(e){}setTimeout(lp,300)})()},
async delacc(){const p=prompt('Hesabını silmek için parolanı yaz. Tüm kitapların ve notların kalıcı olarak silinir.');if(!p)return;try{await reauthenticateWithCredential(user,EmailAuthProvider.credential(user.email,p))}catch(e){return toast('Parola hatalı, hesap silinmedi.')}
const u=user,lim=(pr)=>Promise.race([pr,new Promise((_,j)=>setTimeout(()=>j(new Error('t')),10000))]);
try{if(unsub){unsub();unsub=null}ref=null;await lim(deleteDoc(doc(fdb,'users',u.uid,'library','main')));await lim(deleteDoc(doc(fdb,'users',u.uid)))}catch(e){start(u);return toast('Veriler silinemedi, hesap silinmedi. Bağlantını kontrol edip tekrar dene.')}
try{await deleteUser(u);toast('Hesap ve tüm verilerin silindi.')}catch(e){start(u);toast('Hesap silinemedi. Çıkış yapıp tekrar giriş yaparak dene.')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT')return;e.preventDefault();A[t.dataset.a]?.(t.dataset.v,t)});
document.addEventListener('input',e=>{if(e.target.dataset.a==='sq')A.sq(0,e.target);else if(e.target.dataset.a==='hq'){q=e.target.value;f='all';v='all';qs=1;render()}});
document.addEventListener('change',async e=>{if(e.target.id!=='fi'||!e.target.files[0])return;const inp=e.target;const all=parse((await inp.files[0].text()).replace(/^\ufeff/,''));inp.value='';
if(!['baslik','title','kitap','kitap adi'].includes(fold((all[0]||[])[0]).trim()))return toast('İlk sütun "Başlık" olmalı (sıra: Başlık, Yazar, Okundu, Not, ISBN).');
const rs=all.slice(1).filter(r=>r[0]&&r[0].trim());const have=new Set(books.map(b=>fold(b.t+b.a)));let n=0,dup=0,lim=0;
rs.forEach((r,i)=>{const k=fold(r[0]+(r[1]||''));if(have.has(k)){dup++;return}if(books.length>=500){lim++;return}have.add(k);const is=(r[4]||'').replace(/\D/g,'');books.push({id:'c'+Date.now().toString(36)+i,t:r[0].trim(),a:(r[1]||'').trim(),isbn:is.length==13?is:'',n:r[3]||'',r:['okundu','evet','1','true'].includes(fold(r[2]||'')),l:null,ad:Date.now()});n++});
persist();render();toast(n+' kitap eklendi'+(dup?', '+dup+' yinelenen atlandı':'')+(lim?', '+lim+' kayıt 500 sınırı nedeniyle atlandı':'')+'.')});
addEventListener('online',render);addEventListener('offline',render);
function start(u){if(unsub){unsub();unsub=null}user=u;if(!u){if(!['reg','reset','login','ob'].includes(v))v=localStorage.ob?'login':'ob';return render()}
if(!u.emailVerified){v='verify';return render()}
ref=doc(fdb,'users',u.uid,'library','main');unsub=onSnapshot(ref,s=>{const d=s.exists()?s.data():{};books=Array.isArray(d.books)?d.books:[];set=d.set||{};if(set.th)theme(set.th);if(set.fs){localStorage.fs=set.fs;document.documentElement.style.fontSize=set.fs}const old=books.filter(b=>b.x&&Date.now()-b.x>6048e5);if(old.length){books=books.filter(b=>!old.includes(b));persist()}if(['boot','login','reg','reset','verify','ob'].includes(v))v='home';render()},()=>toast('Kitaplığa erişilemedi.'))}
onIdTokenChanged(auth,start);render();
